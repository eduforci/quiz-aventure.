function fmt(t){return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function tick(){if(over)return;tm--;var e=document.getElementById("tmr");if(e){e.textContent="⏱️ "+fmt(tm);e.style.color=tm<=30?"var(--ko)":""}if(tm<=0)end(false,true)}
function start(){S=ld();P=Z.map(function(a,k){return pick(k)});st();z=0;qi=0;vies=5;pts=0;inv=[];serie=0;errZ=0;bad=[];bm="";over=false;tm=TOTAL;clearInterval(tid);tid=setInterval(tick,1000);play()}
function hdr(){return '<div class="top"><span>❤️ '+vies+'</span><span>⭐ '+pts+'</span><span>🏅 '+bad.length+'</span><span id="tmr">⏱️ '+fmt(tm)+'</span><span id="snb" style="cursor:pointer">'+(son?'🔊':'🔇')+'</span></div>'+
 '<div class="map">'+Z.map(function(a,k){return (k?'<div class="bar"></div>':'')+'<div class="z '+(k<z?'done':k==z?'cur':'')+'">'+a.i+'</div>'}).join('')+'</div>'}
function play(){if(over)return;
 if(vies<=0)return end(false);
 if(z>=Z.length)return end(true);
 var Q=P[z][qi];
 app.innerHTML=hdr()+'<div class="card"><div class="cat">'+Z[z].n+' · '+Z[z].c+'</div><div class="q">'+Q[0]+'</div>'+
 Q[1].map(function(t,k){return '<button data-k="'+k+'">'+t+'</button>'}).join('')+'<div class="msg" id="m"></div></div>';
 app.querySelectorAll("button").forEach(function(b){b.onclick=function(){answer(+b.dataset.k,Q)}});
}
function answer(k,Q){
 var bs=app.querySelectorAll("button"),m=document.getElementById("m");
 bs.forEach(function(b){b.disabled=true});
 bs[Q[2]].className="ok";
 if(k==Q[2]){pts+=10;serie++;jou("ok");var g1=serie%5==0&&vies<7;if(g1)vies++;m.innerHTML="✅ Bravo ! +10 points"+(g1?"<br>❤️ +1 vie !":"")+bdg("serie",serie>=5)+bdg("cent",pts>=100)}
 else{vies--;serie=0;errZ++;jou("ko");bs[k].className="ko";m.textContent="❌ Raté ! Tu perds une vie"}
 setTimeout(next,1300);
}
function next(){if(over)return;
 qi++;
 if(qi>=P[z].length&&vies>0){inv.push(Z[z].o);bm=bdg("zone",errZ==0);if(errZ==0&&vies<7){vies++;bm+="<br>❤️ +1 vie : zone sans faute"}errZ=0;jou("zone");qi=0;z++;
  if(z<Z.length){app.innerHTML=hdr()+'<div class="card"><div class="big">'+Z[z-1].o.split(" ")[0]+'</div><div class="q" style="text-align:center">Zone réussie ! Tu gagnes : '+Z[z-1].o+bm+'</div><p style="text-align:center;color:var(--mut)">Zone suivante…</p></div>';
   setTimeout(play,2400);return}}
 play();
}
function end(w,t){clearInterval(tid);over=true;if(w)bdg("champ",1);jou(w?"win":"lose");
 app.innerHTML='<div class="card"><div class="big">'+(w?'🏆':t?'⏱️':'💔')+'</div><div class="q" style="text-align:center">'+(w?'Félicitations, tu as trouvé le trésor !':t?'Temps écoulé… l’aventure s’arrête ici.':'Plus de vies… l’aventure s’arrête ici.')+'</div><p style="text-align:center">'+lvn+' · Score : ⭐ '+pts+'</p><div class="inv">'+inv.map(function(o){return o.split(" ")[0]}).join(" ")+'</div><p style="text-align:center">'+(bad.length?bad.map(function(b){return B[b]}).join("<br>"):"Aucun badge cette fois")+'</p><button class="main" id="re">Rejouer</button></div>';
 document.getElementById("re").onclick=menu;var sb=document.createElement("button");sb.className="main";sb.textContent="📲 Partager mon score";sb.onclick=function(){var m="🗺️ J’ai fait "+pts+" points à Quiz Aventure ("+lvn+") ! Peux-tu faire mieux ? "+"https://quiz-aventure.vercel.app";window.open("https://wa.me/?text="+encodeURIComponent(m))};document.getElementById("re").after(sb);
}
menu();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})}</script>
</body>
</html>
